<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>關主即時審核指揮所</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
</head>
<body class="bg-stone-900 text-stone-100 min-h-screen p-4 pb-12">
    <h1 class="text-2xl font-black text-center text-amber-500 mb-6 border-b border-stone-700 pb-3">
        🎖️ 實境解謎・現場審核後台
    </h1>

    <div id="submissions-list" class="max-w-md mx-auto space-y-4">
        <p class="text-center text-stone-400">連線資料庫中...</p>
    </div>

    <script>
      // 填入與遊戲端一致的真實金鑰
      const firebaseConfig = {
        apiKey: "AIzaSyCxIinbYw3OhJhKksVHsqPaYCv0-fLUR3s",
        authDomain: "weee-57379.firebaseapp.com",
        projectId: "weee-57379",
        storageBucket: "weee-57379.firebasestorage.app",
        messagingSenderId: "26784647",
        appId: "1:26784647:web:e3c682e0915fe43ddf5922"
      };
      firebase.initializeApp(firebaseConfig);
      const db = firebase.firestore();

      // 即時監聽 pending 狀態的照片
      db.collection("submissions")
        .where("status", "==", "pending")
        .onSnapshot((snapshot) => {
            const list = document.getElementById('submissions-list');
            if (snapshot.empty) {
                list.innerHTML = '<div class="text-center text-stone-500 py-12">目前沒有待審核的照片</div>';
                return;
            }
            list.innerHTML = '';
            snapshot.forEach((doc) => {
                const item = doc.data();
                const card = document.createElement('div');
                card.className = "bg-stone-800 border-2 border-stone-700 p-4 rounded shadow-lg";
                card.innerHTML = `
                    <div class="flex justify-between items-center mb-2">
                        <span class="font-bold text-lg text-amber-400">${item.teamName || '未知隊伍'}</span>
                        <span class="text-xs bg-stone-700 px-2 py-1 rounded">${item.levelId || '調查任務'}</span>
                    </div>
                    <!-- 修正為讀取玩家端上傳的 imageBase64 欄位 -->
                    <img src="${item.imageBase64}" class="w-full h-auto rounded border border-stone-600 mb-3 bg-black/40" alt="線索照片" />
                    <div class="grid grid-cols-2 gap-3">
                        <button onclick="updateStatus('${doc.id}', 'rejected')" class="py-2.5 bg-red-900/80 hover:bg-red-800 text-white font-bold rounded transition active:scale-95">✖ 駁回重拍</button>
                        <button onclick="updateStatus('${doc.id}', 'approved')" class="py-2.5 bg-emerald-700 hover:bg-emerald-600 text-white font-bold rounded transition active:scale-95">✔ 核准通過</button>
                    </div>
                `;
                list.appendChild(card);
            });
        }, (error) => {
            console.error("Firestore 監聽失敗：", error);
            document.getElementById('submissions-list').innerHTML = `<div class="text-center text-rose-500 py-8">連線失敗：${error.message}</div>`;
        });

      function updateStatus(id, newStatus) {
          db.collection("submissions").doc(id).update({
              status: newStatus
          }).catch((err) => {
              alert("審核狀態更新失敗：" + err.message);
          });
      }
    </script>
</body>
</html>
