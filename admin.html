<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>三重空軍一村 - 前線任務指揮所 (關主後台)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Courier+Prime:wght@700&family=Noto+Serif+TC:wght@700;900&display=swap" rel="stylesheet">
    
    <!-- Firebase Compat SDK v10.8.0 -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-storage-compat.js"></script>

    <style>
        body { font-family: 'Courier Prime', 'Noto Serif TC', serif; background-color: #12100e; color: #dcd4c3; touch-action: manipulation; }
        .military-card { background: #1c1917; border: 2px solid #443c33; box-shadow: 4px 4px 0 #0c0a09; }
        .btn-approve { background: #166534; border: 2px solid #14532d; color: #f0fdf4; box-shadow: 3px 3px 0 #052e16; }
        .btn-approve:active { transform: translate(2px, 2px); box-shadow: 1px 1px 0 #052e16; }
        .btn-reject { background: #991b1b; border: 2px solid #7f1d1d; color: #fef2f2; box-shadow: 3px 3px 0 #450a0a; }
        .btn-reject:active { transform: translate(2px, 2px); box-shadow: 1px 1px 0 #450a0a; }
        .tag-pending { background: #854d0e; color: #fef08a; border: 1px solid #ca8a04; }
    </style>
</head>
<body class="min-h-[100dvh] flex flex-col items-center justify-start pb-12">

    
    <!-- 頂部資訊列 -->
    <header class="w-full max-w-lg bg-[#1c1917] border-b-4 border-[#3b3227] px-4 py-3 sticky top-0 z-30 shadow-lg flex items-center justify-between">
        <div class="flex items-center space-x-2">
            <span class="w-2.5 h-2.5 rounded-full bg-emerald-500 animate-pulse"></span>
            <span class="font-black text-sm tracking-wider text-[#e5d5b5]">前線通訊所</span>
        </div>
        <!-- 找到 <header> 內的右側按鈕區塊，替換或加入以下內容 -->
        <div class="flex items-center space-x-3">
            <div class="text-xs bg-[#2b2520] border border-[#574c3d] px-2.5 py-1 rounded text-[#e5d5b5] font-mono">
                待核准: <b id="pending-counter" class="text-amber-400 text-sm">0</b>
            </div>
            <button onclick="toggleAudio()" id="btn-audio" class="text-xs px-2.5 py-1 border border-[#574c3d] bg-[#292524] text-stone-300 rounded">
                <i class="fa-solid fa-bell"></i>
            </button>
            <!-- 新增：全部清空按鈕 -->
            <button onclick="clearAllSubmissions()" title="清空全部紀錄" class="text-xs px-2.5 py-1 border border-red-800 bg-red-950/60 text-red-300 rounded hover:bg-red-900 active:scale-95">
                <i class="fa-solid fa-trash-can mr-1"></i>清空紀錄
            </button>
        </div>
    </header>

    <!-- 主內容區 -->
    <main class="w-full max-w-lg p-4 space-y-4">
        <!-- 關卡房間分流選單 -->
        <div class="space-y-1.5 mb-3">
            <div class="text-[11px] text-stone-400 font-bold flex items-center justify-between">
                <span><i class="fa-solid fa-door-open text-[#a1824a] mr-1"></i>當前審核房間：</span>
                <span id="current-room-label" class="text-amber-400 font-mono">全部關卡</span>
            </div>
            <div class="grid grid-cols-4 gap-1.5 text-xs font-bold font-mono">
                <button onclick="setRoom('ALL')" id="room-btn-ALL" class="py-2 rounded-sm border border-[#a1824a] bg-[#a1824a] text-[#12100e]">全部</button>
                <button onclick="setRoom('1')" id="room-btn-1" class="py-2 rounded-sm border border-[#443c33] bg-[#1c1917] text-stone-400">任務一</button>
                <button onclick="setRoom('2')" id="room-btn-2" class="py-2 rounded-sm border border-[#443c33] bg-[#1c1917] text-stone-400">任務二</button>
                <button onclick="setRoom('3')" id="room-btn-3" class="py-2 rounded-sm border border-[#443c33] bg-[#1c1917] text-stone-400">任務三</button>
            </div>
        </div>
        <!-- 分籤切換 -->
        <div class="grid grid-cols-2 gap-2 text-xs font-bold font-mono">
            <button id="tab-pending" onclick="switchTab('pending')" class="py-2.5 border-b-2 border-amber-500 text-amber-400 bg-[#1c1917]">
                待審核任務
            </button>
            <button id="tab-resolved" onclick="switchTab('resolved')" class="py-2.5 border-b-2 border-transparent text-stone-400 hover:text-stone-200">
                審核紀錄 (近20筆)
            </button>
        </div>

        <!-- 任務列表容器 -->
        <div id="submissions-list" class="space-y-4">
            <div class="text-center py-16 text-stone-500 text-sm font-mono">
                <i class="fa-solid fa-spinner fa-spin text-2xl mb-3 block text-stone-600"></i>
                正在連線至前線基地資料庫...
            </div>
        </div>
    </main>

    <!-- 圖片放大燈箱 Modal -->
    <div id="lightbox-modal" class="fixed inset-0 z-50 bg-black/90 hidden flex flex-col items-center justify-center p-4" onclick="closeLightbox()">
        <img id="lightbox-img" src="" class="max-w-full max-h-[85vh] object-contain border-2 border-stone-600 rounded-sm shadow-2xl">
        <p class="text-xs text-stone-400 mt-3 font-mono">點擊任意處關閉檢視</p>
    </div>

    <script>
        // 1. Firebase 初始化
        const firebaseConfig = {
            apiKey: "AIzaSyCxIinbYw3OhJhKksVHsqPaYCv0-fLUR3s",
            authDomain: "weee-57379.firebaseapp.com",
            databaseURL: "https://weee-57379-default-rtdb.asia-southeast1.firebasedatabase.app",
            projectId: "weee-57379",
            storageBucket: "weee-57379.firebasestorage.app",
            messagingSenderId: "26784647",
            appId: "1:26784647:web:e3c682e0915fe43ddf5922",
            measurementId: "G-VJKC5DMSBS"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();
        
        // 提示音效 Web Audio
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        function playChime() {
            if (!isAudioEnabled) return;
            try {
                if (audioCtx.state === 'suspended') audioCtx.resume();
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(880, audioCtx.currentTime);
                gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.3);
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.3);
            } catch (e) {}
        }


        // 頁面開啟時直接啟動監聽（無密碼門禁）
        window.addEventListener('load', () => {
            startListening();
        });
        // 4. 即時監聽 Firestore
        let unsubscribe = null;
        function startListening() {
            if (unsubscribe) unsubscribe();
            
            // 監聽最近的 50 筆紀錄
            unsubscribe = db.collection("submissions")
                .orderBy("createdAt", "desc")
                .limit(50)
                .onSnapshot((snapshot) => {
                    currentSubmissions = [];
                    snapshot.forEach(doc => {
                        currentSubmissions.push({ id: doc.id, ...doc.data() });
                    });
                    
                    const pendingList = currentSubmissions.filter(s => s.status === 'pending');
                    document.getElementById('pending-counter').textContent = pendingList.length;

                    // 新資料抵達時播放音效
                    if (pendingList.length > previousPendingCount) {
                        playChime();
                    }
                    previousPendingCount = pendingList.length;

                    renderList();
                }, (error) => {
                    console.error("監聽失敗:", error);
                    document.getElementById('submissions-list').innerHTML = `
                        <div class="military-card p-4 text-center text-red-400 text-xs">
                            連線受阻：${error.message}
                        </div>`;
                });
        }

        // 5. 渲染邏輯
        function switchTab(tab) {
            currentTab = tab;
            const tabP = document.getElementById('tab-pending');
            const tabR = document.getElementById('tab-resolved');
            if (tab === 'pending') {
                tabP.className = "py-2.5 border-b-2 border-amber-500 text-amber-400 bg-[#1c1917]";
                tabR.className = "py-2.5 border-b-2 border-transparent text-stone-400 hover:text-stone-200";
            } else {
                tabR.className = "py-2.5 border-b-2 border-amber-500 text-amber-400 bg-[#1c1917]";
                tabP.className = "py-2.5 border-b-2 border-transparent text-stone-400 hover:text-stone-200";
            }
            renderList();
        }

        // 當前選擇的關卡房間 ('ALL', '1', '2', '3')
        let selectedRoom = 'ALL';
        
        // 關卡房間切換函式
        function setRoom(roomId) {
            selectedRoom = roomId;
            
            // 更新按鈕樣式
            ['ALL', '1', '2', '3'].forEach(id => {
                const btn = document.getElementById(`room-btn-${id}`);
                if (!btn) return;
                if (id === roomId) {
                    btn.className = "py-2 rounded-sm border border-[#a1824a] bg-[#a1824a] text-[#12100e]";
                } else {
                    btn.className = "py-2 rounded-sm border border-[#443c33] bg-[#1c1917] text-stone-400";
                }
            });
        
            const labels = {
                'ALL': '全部關卡',
                '1': '任務一 (防砲陣地)',
                '2': '任務二 (眷舍空間)',
                '3': '任務三 (村長的家)'
            };
            document.getElementById('current-room-label').textContent = labels[roomId] || '未知房間';
            
            renderList();
        }
        
        // 渲染列表（整合：分籤 + 關卡房間過濾）
        function renderList() {
            const container = document.getElementById('submissions-list');
        
            // 1. 狀態篩選 (待審核 vs 已處理)
            let filtered = currentSubmissions.filter(item => {
                return currentTab === 'pending' ? item.status === 'pending' : item.status !== 'pending';
            });
        
            // 2. 關卡房間篩選 (依照 levelId 模糊或精確比對)
            if (selectedRoom !== 'ALL') {
                filtered = filtered.filter(item => {
                    const lvl = String(item.levelId || '');
                    if (selectedRoom === '1') return lvl.includes('一') || lvl.includes('1') || lvl.includes('防砲');
                    if (selectedRoom === '2') return lvl.includes('二') || lvl.includes('2') || lvl.includes('眷舍');
                    if (selectedRoom === '3') return lvl.includes('三') || lvl.includes('3') || lvl.includes('村長');
                    return true;
                });
            }
        
            // 更新計數器 (顯示當前房間內的待審數量)
            const pendingInRoom = currentSubmissions.filter(s => {
                if (s.status !== 'pending') return false;
                if (selectedRoom === 'ALL') return true;
                const lvl = String(s.levelId || '');
                if (selectedRoom === '1') return lvl.includes('一') || lvl.includes('1') || lvl.includes('防砲');
                if (selectedRoom === '2') return lvl.includes('二') || lvl.includes('2') || lvl.includes('眷舍');
                if (selectedRoom === '3') return lvl.includes('三') || lvl.includes('3') || lvl.includes('村長');
                return true;
            });
            document.getElementById('pending-counter').textContent = pendingInRoom.length;
        
            if (filtered.length === 0) {
                container.innerHTML = `
                    <div class="military-card p-10 text-center text-stone-500">
                        <i class="fa-solid fa-inbox text-4xl mb-3 opacity-40"></i>
                        <p class="text-sm font-bold">${currentTab === 'pending' ? '此關卡房間目前無待審核任務' : '此關卡無歷史審核紀錄'}</p>
                    </div>`;
                return;
            }
        
            container.innerHTML = filtered.map(item => {
                const timeStr = item.createdAt ? new Date(item.createdAt.toDate ? item.createdAt.toDate() : item.createdAt).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', second: '2-digit' }) : '--:--:--';
                const imgSrc = item.photoUrl || item.imageBase64 || '';
                
                let badgeHtml = '';
                if (item.status === 'pending') badgeHtml = `<span class="text-[10px] font-mono px-2 py-0.5 rounded font-black tag-pending">待審核</span>`;
                else if (item.status === 'approved') badgeHtml = `<span class="text-[10px] font-mono px-2 py-0.5 rounded font-black bg-emerald-950 text-emerald-300 border border-emerald-700">已核准</span>`;
                else badgeHtml = `<span class="text-[10px] font-mono px-2 py-0.5 rounded font-black bg-red-950 text-red-300 border border-red-700">已退回</span>`;
        
                return `
                <div class="military-card p-4 space-y-3">
                    <div class="flex items-center justify-between border-b border-[#332c25] pb-2">
                        <div class="flex items-center space-x-2">
                            <i class="fa-solid fa-users text-[#a1824a] text-sm"></i>
                            <span class="font-black text-[#e5d5b5] text-base">${escapeHtml(item.teamName || '未知隊伍')}</span>
                        </div>
                        <div class="flex items-center space-x-2">
                            <span class="text-[10px] font-mono text-stone-400">${timeStr}</span>
                            ${badgeHtml}
                        </div>
                    </div>
        
                    <div class="text-xs text-stone-400 font-bold">
                        任務目標：<span class="text-[#e5d5b5]">${escapeHtml(item.levelId || '未指定關卡')}</span>
                    </div>
        
                    <div class="w-full aspect-[4/3] bg-black/60 rounded border border-[#332c25] overflow-hidden flex items-center justify-center cursor-pointer relative group" onclick="openLightbox('${imgSrc}')">
                        <img src="${imgSrc}" class="w-full h-full object-cover" loading="lazy">
                        <div class="absolute bottom-2 right-2 bg-black/70 px-2 py-1 rounded text-[10px] text-white flex items-center space-x-1">
                            <i class="fa-solid fa-magnifying-glass-plus"></i><span>點擊放大</span>
                        </div>
                    </div>
        
                    ${item.status === 'pending' ? `
                    <div class="grid grid-cols-2 gap-3 pt-1">
                        <button onclick="updateStatus('${item.id}', 'rejected')" class="py-3 btn-reject font-black text-sm tracking-wider flex items-center justify-center space-x-1 rounded-sm">
                            <i class="fa-solid fa-xmark"></i><span>退回重拍</span>
                        </button>
                        <button onclick="updateStatus('${item.id}', 'approved')" class="py-3 btn-approve font-black text-sm tracking-wider flex items-center justify-center space-x-1 rounded-sm">
                            <i class="fa-solid fa-check"></i><span>核准通過</span>
                        </button>
                    </div>
                    <div class="text-right pt-1">
                        <button onclick="deleteSubmission('${item.id}', '${item.photoUrl || ''}')" class="text-xs text-red-400/80 hover:text-red-300 underline">
                            <i class="fa-solid fa-trash-can mr-1"></i>刪除此單張紀錄
                        </button>
                    </div>
                    ` : `
                    <div class="flex items-center justify-between pt-1">
                        <button onclick="deleteSubmission('${item.id}', '${item.photoUrl || ''}')" class="text-xs text-red-400/80 hover:text-red-300 underline">
                            <i class="fa-solid fa-trash-can mr-1"></i>刪除此單張紀錄
                        </button>
                        <button onclick="updateStatus('${item.id}', 'pending')" class="text-xs text-stone-400 hover:text-amber-400 underline">
                            重新判定此項
                        </button>
                    </div>
                    `}
                </div>`;
            }).join('');
        }
        // 6. 操作資料庫
        // 1. 狀態更新函式（包含重新判定）
        async function updateStatus(docId, newStatus) {
            try {
                await db.collection("submissions").doc(docId).update({
                    status: newStatus,
                    reviewedAt: firebase.firestore.FieldValue.serverTimestamp()
                });
                // 即時更新本地快取並重繪，防止 onSnapshot 延遲
                const target = currentSubmissions.find(s => s.id === docId);
                if (target) target.status = newStatus;
                renderList();
            } catch (err) {
                alert("【狀態變更失敗】\n" + err.message + "\n請確認 Firestore 安全規則是否已開啟 write: if true");
            }
        }
        
        // 2. 單張刪除函式（容錯版）
        async function deleteSubmission(docId, photoUrl) {
            if (!confirm("確定要刪除這筆審核紀錄嗎？此動作無法復原！")) return;
        
            try {
                // 先刪除 Firestore 資料
                await db.collection("submissions").doc(docId).delete();
        
                // 嘗試刪除 Storage 實體檔案（若失敗或為 base64 則安全略過，不阻斷流程）
                if (photoUrl && typeof photoUrl === 'string' && photoUrl.startsWith("http") && photoUrl.includes("firebasestorage")) {
                    try {
                        const storageRef = firebase.storage().refFromURL(photoUrl);
                        await storageRef.delete();
                    } catch (storageErr) {
                        console.warn("Storage 檔案清理略過：", storageErr.message);
                    }
                }
        
                // 從本地陣列移除並立即更新畫面
                currentSubmissions = currentSubmissions.filter(s => s.id !== docId);
                renderList();
            } catch (err) {
                alert("【刪除失敗】\n" + err.message + "\n請檢查 Firestore Rules 權限。");
            }
        }
        
        // 3. 全部清空函式（批次容錯版）
        async function clearAllSubmissions() {
            const inputPass = prompt("【警告】這將清空所有審核記錄！\n請輸入確認代碼「CLEAR」以執行清空：");
            if (inputPass !== "CLEAR") {
                if (inputPass !== null) alert("代碼不正確，已取消操作。");
                return;
            }
        
            try {
                const snapshot = await db.collection("submissions").get();
                if (snapshot.empty) {
                    alert("目前沒有任何紀錄需要清空。");
                    return;
                }
        
                const batch = db.batch();
                snapshot.forEach(doc => {
                    batch.delete(doc.ref);
                });
        
                await batch.commit();
        
                // 清空本地快取並重繪
                currentSubmissions = [];
                renderList();
                alert(`已成功清空共 ${snapshot.size} 筆歷史紀錄！`);
            } catch (err) {
                alert("【清空失敗】\n" + err.message);
            }
        }
        // 7. 燈箱輔助函式
        function openLightbox(src) {
            if (!src) return;
            document.getElementById('lightbox-img').src = src;
            document.getElementById('lightbox-modal').classList.remove('hidden');
        }
        function closeLightbox() {
            document.getElementById('lightbox-modal').classList.add('hidden');
        }

        function toggleAudio() {
            isAudioEnabled = !isAudioEnabled;
            const btn = document.getElementById('btn-audio');
            btn.innerHTML = isAudioEnabled ? '<i class="fa-solid fa-bell text-amber-400"></i>' : '<i class="fa-solid fa-bell-slash text-stone-500"></i>';
        }

        function escapeHtml(str) {
            return String(str).replace(/[&<>"']/g, s => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[s]);
        }
    </script>
</body>
</html>
