<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>三重空軍一村 - 前線任務指揮所 (關主後台)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Courier+Prime:wght@700&family=Noto+Serif+TC:wght@700;900&display=swap" rel="stylesheet">
    
    <!-- Firebase Compat SDK v10.8.0 -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-storage-compat.js"></script>

    <style>
        body { font-family: 'Courier Prime', 'Noto Serif TC', serif; background-color: #12100e; color: #dcd4c3; touch-action: manipulation; }
        .military-card { background: #1c1917; border: 2px solid #443c33; box-shadow: 4px 4px 0 #0c0a09; }
        .btn-approve { background: #166534; border: 2px solid #14532d; color: #f0fdf4; box-shadow: 3px 3px 0 #052e16; }
        .btn-approve:active { transform: translate(2px, 2px); box-shadow: 1px 1px 0 #052e16; }
        .btn-reject { background: #991b1b; border: 2px solid #7f1d1d; color: #fef2f2; box-shadow: 3px 3px 0 #450a0a; }
        .btn-reject:active { transform: translate(2px, 2px); box-shadow: 1px 1px 0 #450a0a; }
        .tag-pending { background: #854d0e; color: #fef08a; border: 1px solid #ca8a04; }
    </style>
</head>
<body class="min-h-[100dvh] flex flex-col items-center justify-start pb-12">

    <!-- 頂部資訊列 -->
    <header class="w-full max-w-lg bg-[#1c1917] border-b-4 border-[#3b3227] px-4 py-3 sticky top-0 z-30 shadow-lg flex items-center justify-between">
        <div class="flex items-center space-x-2">
            <span class="w-2.5 h-2.5 rounded-full bg-emerald-500 animate-pulse"></span>
            <span class="font-black text-sm tracking-wider text-[#e5d5b5]">前線通訊所</span>
        </div>
        <div class="flex items-center space-x-3">
            <div class="text-xs bg-[#2b2520] border border-[#574c3d] px-2.5 py-1 rounded text-[#e5d5b5] font-mono">
                待核准: <b id="pending-counter" class="text-amber-400 text-sm">0</b>
            </div>
            <button onclick="toggleAudio()" id="btn-audio" class="text-xs px-2.5 py-1 border border-[#574c3d] bg-[#292524] text-stone-300 rounded">
                <i class="fa-solid fa-bell text-amber-400"></i>
            </button>
            <button onclick="clearAllSubmissions()" title="清空全部紀錄" class="text-xs px-2.5 py-1 border border-red-800 bg-red-950/60 text-red-300 rounded hover:bg-red-900 active:scale-95">
                <i class="fa-solid fa-trash-can mr-1"></i>清空紀錄
            </button>
        </div>
    </header>

    <!-- 主內容區 -->
    <main class="w-full max-w-lg p-4 space-y-4">
        <!-- 搜尋列 -->
        <div class="relative w-full">
            <input type="text" id="search-team-input" oninput="handleSearch(this.value)" placeholder="🔍 搜尋隊伍名稱或隊員姓名..." class="w-full bg-[#1c1917] border border-[#443c33] rounded px-3 py-2 text-xs text-[#e5d5b5] placeholder:text-stone-500 font-mono outline-none focus:border-amber-500 shadow-inner">
            <button onclick="clearSearch()" id="btn-clear-search" class="hidden absolute right-2.5 top-2 text-stone-500 hover:text-stone-300 text-xs">
                <i class="fa-solid fa-circle-xmark"></i>
            </button>
        </div>

        <!-- 關卡房間分流選單 -->
        <div class="space-y-2 mb-2" id="room-filter-container">
            <div class="text-[11px] text-stone-400 font-bold flex items-center justify-between">
                <span><i class="fa-solid fa-door-open text-[#a1824a] mr-1"></i>當前審核房間：</span>
                <span id="current-room-label" class="text-amber-400 font-mono">全部關卡</span>
            </div>
            <div class="grid grid-cols-3 gap-1.5 text-xs font-bold font-mono">
                <button onclick="setRoom('ALL')" id="room-btn-ALL" class="py-2 rounded-sm border border-[#a1824a] bg-[#a1824a] text-[#12100e]">全部關卡</button>
                <button onclick="setRoom('1')" id="room-btn-1" class="py-2 rounded-sm border border-[#443c33] bg-[#1c1917] text-stone-400">L1 防砲</button>
                <button onclick="setRoom('2')" id="room-btn-2" class="py-2 rounded-sm border border-[#443c33] bg-[#1c1917] text-stone-400">L2 眷舍</button>
                <button onclick="setRoom('3')" id="room-btn-3" class="py-2 rounded-sm border border-[#443c33] bg-[#1c1917] text-stone-400">L3 村長</button>
                <button onclick="setRoom('4')" id="room-btn-4" class="py-2 rounded-sm border border-[#443c33] bg-[#1c1917] text-stone-400">L4 榕樹</button>
                <button onclick="setRoom('5')" id="room-btn-5" class="py-2 rounded-sm border border-[#443c33] bg-[#1c1917] text-stone-400">L5 群星</button>
                <button onclick="setRoom('6-angel')" id="room-btn-6-angel" class="py-2 rounded-sm border border-[#443c33] bg-[#1c1917] text-stone-400">L6 天使</button>
                <button onclick="setRoom('6-note')" id="room-btn-6-note" class="py-2 rounded-sm border border-[#443c33] bg-[#1c1917] text-amber-300">L6 心得專區</button>
                <button onclick="setRoom('7')" id="room-btn-7" class="py-2 rounded-sm border border-[#443c33] bg-[#1c1917] text-stone-400">L7 市集</button>
            </div>
        </div>

        <!-- 三大分籤切換 -->
        <div class="grid grid-cols-3 gap-1.5 text-xs font-bold font-mono border-b border-[#3b3227] pb-1">
            <button id="tab-pending" onclick="switchTab('pending')" class="py-2.5 border-b-2 border-amber-500 text-amber-400 bg-[#1c1917] rounded-t">
                待審任務
            </button>
            <button id="tab-resolved" onclick="switchTab('resolved')" class="py-2.5 border-b-2 border-transparent text-stone-400 hover:text-stone-200">
                審核紀錄
            </button>
            <button id="tab-claims" onclick="switchTab('claims')" class="py-2.5 border-b-2 border-transparent text-emerald-400 hover:text-emerald-300">
                <i class="fa-solid fa-award mr-1"></i>進度與核銷
            </button>
        </div>

        <!-- 任務列表容器 -->
        <div id="submissions-list" class="space-y-4 pt-2">
            <div class="text-center py-16 text-stone-500 text-sm font-mono">
                <i class="fa-solid fa-spinner fa-spin text-2xl mb-3 block text-stone-600"></i>
                正在連線至前線基地資料庫...
            </div>
        </div>

        <!-- 突破筆數限制加載按鈕 -->
        <div id="load-more-container" class="hidden text-center pt-2">
            <button onclick="loadMoreSubmissions()" class="w-full py-2.5 bg-[#241f1c] hover:bg-[#2e2723] text-stone-300 border border-[#443c33] rounded text-xs font-mono font-bold tracking-wider active:scale-98 transition-all">
                <i class="fa-solid fa-angles-down mr-1.5 text-amber-400"></i>載入更多歷史紀錄 (+50 筆)
            </button>
        </div>
    </main>

    <!-- 退回原因快捷選單 Modal -->
    <div id="reject-modal" class="fixed inset-0 z-50 bg-black/80 backdrop-blur-sm hidden flex items-center justify-center p-4">
        <div class="military-card p-5 max-w-sm w-full space-y-4 border-2 border-red-900/60 shadow-2xl">
            <div class="flex items-center justify-between border-b border-[#3b3227] pb-2">
                <span class="font-black text-red-400 text-sm flex items-center">
                    <i class="fa-solid fa-triangle-exclamation mr-2"></i>選擇退回原因
                </span>
                <button onclick="closeRejectModal()" class="text-stone-500 hover:text-stone-300 text-sm">
                    <i class="fa-solid fa-xmark"></i>
                </button>
            </div>
            
            <p class="text-xs text-stone-400">請選擇回報給隊伍的退回說明，或手動輸入理由：</p>
            
            <div class="grid grid-cols-2 gap-2 text-xs font-bold" id="reject-quick-tags">
                <button onclick="selectRejectReason('隊員動作不符 / 未入鏡')" class="p-2.5 bg-[#25201d] hover:bg-red-950/60 border border-[#443c33] hover:border-red-700 text-stone-300 rounded text-left">
                    🙅 動作不符/未入鏡
                </button>
                <button onclick="selectRejectReason('照片模糊 / 角度不正確')" class="p-2.5 bg-[#25201d] hover:bg-red-950/60 border border-[#443c33] hover:border-red-700 text-stone-300 rounded text-left">
                    📷 照片模糊/角度不符
                </button>
                <button onclick="selectRejectReason('非指定地點或構件')" class="p-2.5 bg-[#25201d] hover:bg-red-950/60 border border-[#443c33] hover:border-red-700 text-stone-300 rounded text-left">
                    📍 非指定構件地點
                </button>
                <button onclick="selectRejectReason('現場接唱歌詞有誤 / 未完成')" class="p-2.5 bg-[#25201d] hover:bg-red-950/60 border border-[#443c33] hover:border-red-700 text-stone-300 rounded text-left">
                    🎤 接唱未完成/詞有誤
                </button>
            </div>
            
            <input type="text" id="custom-reject-reason" placeholder="或自行輸入自訂原因..." class="w-full bg-[#12100e] border border-[#443c33] rounded px-3 py-2 text-xs text-stone-200 placeholder:text-stone-600 outline-none focus:border-red-500">
            
            <div class="grid grid-cols-2 gap-2 pt-1">
                <button onclick="closeRejectModal()" class="py-2.5 bg-[#25201d] border border-[#443c33] text-stone-400 rounded text-xs font-bold">
                    取消
                </button>
                <button onclick="confirmReject()" class="py-2.5 btn-reject rounded text-xs font-black tracking-wider">
                    確定退回
                </button>
            </div>
        </div>
    </div>

    <!-- 圖片放大燈箱 Modal -->
    <div id="lightbox-modal" class="fixed inset-0 z-50 bg-black/90 hidden flex flex-col items-center justify-center p-4" onclick="closeLightbox()">
        <img id="lightbox-img" src="" class="max-w-full max-h-[85vh] object-contain border-2 border-stone-600 rounded-sm shadow-2xl">
        <p class="text-xs text-stone-400 mt-3 font-mono">點擊任意處關閉檢視</p>
    </div>

    <script>
        // 1. Firebase 初始化
        const firebaseConfig = {
            apiKey: "AIzaSyCxIinbYw3OhJhKksVHsqPaYCv0-fLUR3s",
            authDomain: "weee-57379.firebaseapp.com",
            databaseURL: "https://weee-57379-default-rtdb.asia-southeast1.firebasedatabase.app",
            projectId: "weee-57379",
            storageBucket: "weee-57379.firebasestorage.app",
            messagingSenderId: "26784647",
            appId: "1:26784647:web:e3c682e0915fe43ddf5922",
            measurementId: "G-VJKC5DMSBS"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        // 2. 全域狀態變數
        let currentTab = 'pending';
        let selectedRoom = 'ALL';
        let searchQuery = '';
        let queryLimit = 50;
        let currentSubmissions = [];
        let previousPendingCount = 0;
        let isAudioEnabled = true;
        let unsubscribe = null;
        let pendingRejectDocId = null;

        // 3. 提示音效 Web Audio
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        function playChime() {
            if (!isAudioEnabled) return;
            try {
                if (audioCtx.state === 'suspended') audioCtx.resume();
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(880, audioCtx.currentTime);
                gain.gain.setValueAtTime(0.12, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.35);
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.35);
            } catch (e) {
                console.warn("音效播放失敗:", e);
            }
        }

        // 4. 即時監聽 Firestore（支援動態筆數）
        function startListening() {
            if (unsubscribe) {
                unsubscribe();
                unsubscribe = null;
            }
            
            unsubscribe = db.collection("submissions")
                .orderBy("createdAt", "desc")
                .limit(queryLimit)
                .onSnapshot((snapshot) => {
                    const list = [];
                    snapshot.forEach(doc => {
                        list.push({ id: doc.id, ...doc.data() });
                    });
                    currentSubmissions = list;
                    
                    const pendingList = currentSubmissions.filter(s => s.status === 'pending');
                    if (pendingList.length > previousPendingCount) {
                        try { playChime(); } catch(err) {}
                    }
                    previousPendingCount = pendingList.length;

                    renderList();
                }, (error) => {
                    console.error("即時監聽失敗:", error);
                    document.getElementById('submissions-list').innerHTML = `
                        <div class="military-card p-4 text-center text-red-400 text-xs">
                            連線受阻：${error.message}
                        </div>`;
                });
        }

        function loadMoreSubmissions() {
            queryLimit += 50;
            startListening();
        }

        // 5. 搜尋功能
        function handleSearch(val) {
            searchQuery = val.trim().toLowerCase();
            const clearBtn = document.getElementById('btn-clear-search');
            if (clearBtn) {
                if (searchQuery) clearBtn.classList.remove('hidden');
                else clearBtn.classList.add('hidden');
            }
            renderList();
        }

        function clearSearch() {
            const input = document.getElementById('search-team-input');
            if (input) input.value = '';
            searchQuery = '';
            document.getElementById('btn-clear-search').classList.add('hidden');
            renderList();
        }

        // 6. 分籤與房間分流切換
        function switchTab(tab) {
            currentTab = tab;
            const tabP = document.getElementById('tab-pending');
            const tabR = document.getElementById('tab-resolved');
            const tabC = document.getElementById('tab-claims');
            const roomBox = document.getElementById('room-filter-container');
            const loadMoreBox = document.getElementById('load-more-container');

            [tabP, tabR, tabC].forEach(t => t.className = "py-2.5 border-b-2 border-transparent text-stone-400 hover:text-stone-200");

            if (tab === 'pending') {
                tabP.className = "py-2.5 border-b-2 border-amber-500 text-amber-400 bg-[#1c1917] rounded-t";
                roomBox.classList.remove('hidden');
                loadMoreBox.classList.add('hidden');
            } else if (tab === 'resolved') {
                tabR.className = "py-2.5 border-b-2 border-amber-500 text-amber-400 bg-[#1c1917] rounded-t";
                roomBox.classList.remove('hidden');
                loadMoreBox.classList.remove('hidden');
            } else {
                tabC.className = "py-2.5 border-b-2 border-emerald-500 text-emerald-400 bg-[#1c1917] rounded-t";
                roomBox.classList.add('hidden'); // 核銷看板不需按房間過濾
                loadMoreBox.classList.add('hidden');
            }
            renderList();
        }

        function setRoom(roomId) {
            selectedRoom = roomId;
            ['ALL', '1', '2', '3', '4', '5', '6-angel', '6-note', '7'].forEach(id => {
                const btn = document.getElementById(`room-btn-${id}`);
                if (!btn) return;
                if (id === roomId) {
                    btn.className = "py-2 rounded-sm border border-[#a1824a] bg-[#a1824a] text-[#12100e]";
                } else {
                    btn.className = "py-2 rounded-sm border border-[#443c33] bg-[#1c1917] text-stone-400";
                }
            });
            
            const labels = {
                'ALL': '全部關卡',
                '1': 'L1 (防砲陣地)',
                '2': 'L2 (眷舍空間)',
                '3': 'L3 (村長的家)',
                '4': 'L4 (榕樹廣場)',
                '5': 'L5 (群星之夜)',
                '6-angel': 'L6 (白T小天使報到)',
                '6-note': 'L6 (時代金曲心得專區)',
                '7': 'L7 (市集攤位)'
            };
            document.getElementById('current-room-label').textContent = labels[roomId] || '未知房間';
            renderList();
        }

        // 7. 核心渲染函式
        function renderList() {
            const container = document.getElementById('submissions-list');
            if (!container) return;

            // 專屬分支：各隊通關進度總覽與紀念品核銷專區
            if (currentTab === 'claims') {
                renderClaimsDashboard(container);
                return;
            }

            // A. 分籤過濾
            let filtered = currentSubmissions.filter(item => {
                return currentTab === 'pending' ? item.status === 'pending' : item.status !== 'pending';
            });

            // B. 房間過濾
            const matchRoom = (item) => {
                if (selectedRoom === 'ALL') return true;
                const lvl = String(item.levelId || '').toUpperCase();
                if (selectedRoom === '1') return lvl.includes('一') || lvl.includes('1') || lvl.includes('L1') || lvl.includes('防砲');
                if (selectedRoom === '2') return lvl.includes('二') || lvl.includes('2') || lvl.includes('L2') || lvl.includes('眷舍');
                if (selectedRoom === '3') return lvl.includes('三') || lvl.includes('3') || lvl.includes('L3') || lvl.includes('村長');
                if (selectedRoom === '4') return lvl.includes('四') || lvl.includes('4') || lvl.includes('L4') || lvl.includes('兒童') || lvl.includes('中學生') || lvl.includes('奶奶');
                if (selectedRoom === '5') return lvl.includes('五') || lvl.includes('5') || lvl.includes('L5') || lvl.includes('群星');
                if (selectedRoom === '6-angel') return (lvl.includes('六') || lvl.includes('6') || lvl.includes('L6')) && (lvl.includes('天使') || !item.note);
                if (selectedRoom === '6-note') return (lvl.includes('六') || lvl.includes('6') || lvl.includes('L6')) && (Boolean(item.note) || lvl.includes('心得'));
                if (selectedRoom === '7') return lvl.includes('七') || lvl.includes('7') || lvl.includes('L7') || lvl.includes('市集');
                return true;
            };
            filtered = filtered.filter(matchRoom);

            // C. 關鍵字搜尋過濾（隊名、隊員名單）
            if (searchQuery) {
                filtered = filtered.filter(item => {
                    const tName = String(item.teamName || '').toLowerCase();
                    const tMembers = String(item.teamMembers || '').toLowerCase();
                    return tName.includes(searchQuery) || tMembers.includes(searchQuery);
                });
            }

            // 更新待審核計數器
            const pendingInRoom = currentSubmissions.filter(s => s.status === 'pending' && matchRoom(s));
            document.getElementById('pending-counter').textContent = pendingInRoom.length;

            if (filtered.length === 0) {
                container.innerHTML = `
                    <div class="military-card p-10 text-center text-stone-500">
                        <i class="fa-solid fa-inbox text-4xl mb-3 opacity-40"></i>
                        <p class="text-sm font-bold">${searchQuery ? '查無符合搜尋條件之隊伍' : (currentTab === 'pending' ? '目前無待審核任務' : '目前無審核紀錄')}</p>
                    </div>`;
                return;
            }

            // 渲染審核卡片
            container.innerHTML = filtered.map(item => {
                const timeStr = item.createdAt ? new Date(item.createdAt.toDate ? item.createdAt.toDate() : item.createdAt).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', second: '2-digit' }) : '--:--:--';
                const imgSrc = item.photoUrl || item.imageBase64 || '';
                
                let badgeHtml = '';
                if (item.status === 'pending') badgeHtml = `<span class="text-[10px] font-mono px-2 py-0.5 rounded font-black tag-pending">待審核</span>`;
                else if (item.status === 'approved') badgeHtml = `<span class="text-[10px] font-mono px-2 py-0.5 rounded font-black bg-emerald-950 text-emerald-300 border border-emerald-700">已核准</span>`;
                else badgeHtml = `<span class="text-[10px] font-mono px-2 py-0.5 rounded font-black bg-red-950 text-red-300 border border-red-700">已退回</span>`;

                let mediaContent = '';
                if (imgSrc) {
                    mediaContent = `
                    <div class="w-full aspect-[4/3] bg-black/60 rounded border border-[#332c25] overflow-hidden flex items-center justify-center cursor-pointer relative group" onclick="openLightbox('${imgSrc}')">
                        <img src="${imgSrc}" class="w-full h-full object-cover" loading="lazy">
                        <div class="absolute bottom-2 right-2 bg-black/70 px-2 py-1 rounded text-[10px] text-white flex items-center space-x-1">
                            <i class="fa-solid fa-magnifying-glass-plus"></i><span>點擊放大</span>
                        </div>
                    </div>`;
                } else {
                    const isL5 = String(item.levelId || '').includes('群星') || Boolean(item.singer);
                    const isSongNote = Boolean(item.note);

                    let detailHtml = '';
                    if (isL5) {
                        detailHtml = `
                        <div class="w-full mt-3 p-3 bg-[#12100e] border border-amber-600/50 rounded-md text-left text-xs shadow-inner">
                            <div class="text-[#a1824a] text-xs font-bold flex items-center justify-between border-b border-[#3b3227] pb-1.5">
                                <span><i class="fa-solid fa-microphone-lines text-amber-400 mr-1.5"></i>現場實體接唱驗收</span>
                                <span class="text-amber-300 font-bold">${escapeHtml(item.singer || '歌手')}</span>
                            </div>
                            <div class="text-stone-400 text-xs mt-2 leading-relaxed">隊員已完成現場開口唱，確認後即可點擊「核准通過」。</div>
                        </div>`;
                    } else if (isSongNote) {
                        detailHtml = `
                        <div class="w-full mt-3 p-3 bg-[#12100e] border border-amber-600/60 rounded-md text-[#dcd4c3] text-sm text-left shadow-inner">
                            <div class="text-[#a1824a] text-[10px] mb-1 font-bold flex items-center">
                                <i class="fa-solid fa-pen-fancy text-amber-400 mr-1.5"></i><span>玩家音樂回憶與心得：</span>
                            </div>
                            <div class="whitespace-pre-line leading-relaxed text-amber-100 font-serif">${escapeHtml(item.note)}</div>
                        </div>`;
                    }

                    mediaContent = `
                    <div class="w-full p-4 bg-[#2b2520] rounded border border-[#332c25] flex flex-col items-center justify-center text-center">
                        <div class="w-10 h-10 rounded-full bg-[#1c1917] border border-[#443c33] flex items-center justify-center mb-2 shadow-inner">
                            <i class="fa-solid ${isL5 ? 'fa-microphone text-emerald-400' : (isSongNote ? 'fa-record-vinyl text-amber-400' : 'fa-clipboard-check text-[#a1824a]')} text-xl"></i>
                        </div>
                        <span class="text-[#e5d5b5] font-black tracking-widest text-sm">${isL5 ? '現場實體接唱申請' : (isSongNote ? '時代金曲心得回傳' : '現場任務通關回報')}</span>
                        ${detailHtml}
                    </div>`;
                }

                // 駁回理由顯示
                const rejectReasonHtml = item.rejectReason ? `
                    <div class="text-xs bg-red-950/40 border border-red-900/60 p-2 rounded text-red-300 flex items-start space-x-1.5">
                        <i class="fa-solid fa-circle-exclamation text-red-400 mt-0.5"></i>
                        <span>退回理由：<b>${escapeHtml(item.rejectReason)}</b></span>
                    </div>` : '';

                return `
                <div class="military-card p-4 space-y-3">
                    <div class="flex items-start justify-between border-b border-[#332c25] pb-2">
                        <div>
                            <div class="flex items-center space-x-2">
                                <i class="fa-solid fa-users text-[#a1824a] text-sm"></i>
                                <span class="font-black text-[#e5d5b5] text-base">${escapeHtml(item.teamName || '未知隊伍')}</span>
                            </div>
                            ${item.teamMembers ? `<div class="text-[11px] text-stone-400 mt-0.5 tracking-wide"><i class="fa-solid fa-id-card text-stone-500 mr-1 text-[10px]"></i>隊員：${escapeHtml(item.teamMembers)}</div>` : ''}
                        </div>
                        <div class="flex items-center space-x-2 shrink-0">
                            <span class="text-[10px] font-mono text-stone-400">${timeStr}</span>
                            ${badgeHtml}
                        </div>
                    </div>

                    <div class="text-xs text-stone-400 font-bold">
                        任務目標：<span class="text-[#e5d5b5]">${escapeHtml(item.levelId || '未指定關卡')}</span>
                    </div>

                    ${mediaContent}
                    ${rejectReasonHtml}

                    ${item.status === 'pending' ? `
                    <div class="grid grid-cols-2 gap-3 pt-1">
                        <button onclick="openRejectModal('${item.id}')" class="py-3 btn-reject font-black text-sm tracking-wider flex items-center justify-center space-x-1 rounded-sm">
                            <i class="fa-solid fa-xmark"></i><span>退回不准</span>
                        </button>
                        <button onclick="updateStatus('${item.id}', 'approved')" class="py-3 btn-approve font-black text-sm tracking-wider flex items-center justify-center space-x-1 rounded-sm">
                            <i class="fa-solid fa-check"></i><span>核准通過</span>
                        </button>
                    </div>
                    <div class="text-right pt-1">
                        <button onclick="deleteSubmission('${item.id}', '${imgSrc}')" class="text-xs text-red-400/80 hover:text-red-300 underline">
                            <i class="fa-solid fa-trash-can mr-1"></i>刪除此單張紀錄
                        </button>
                    </div>
                    ` : `
                    <div class="flex items-center justify-between pt-1">
                        <button onclick="deleteSubmission('${item.id}', '${imgSrc}')" class="text-xs text-red-400/80 hover:text-red-300 underline">
                            <i class="fa-solid fa-trash-can mr-1"></i>刪除此單張紀錄
                        </button>
                        <button onclick="updateStatus('${item.id}', 'pending')" class="text-xs text-stone-400 hover:text-amber-400 underline">
                            重新判定此項
                        </button>
                    </div>
                    `}
                </div>`;
            }).join('');
        }

        // 8. 結案核銷與隊伍進度看板專區渲染
        function renderClaimsDashboard(container) {
            // 聚合各隊通關進度
            const teamMap = {};
            currentSubmissions.forEach(sub => {
                const tName = sub.teamName || '未命名隊伍';
                if (!teamMap[tName]) {
                    teamMap[tName] = {
                        name: tName,
                        members: sub.teamMembers || '',
                        approvedLevels: new Set(),
                        giftClaimed: sub.giftClaimed || false,
                        giftClaimedTime: sub.giftClaimedTime || '',
                        lastActive: sub.createdAt ? (sub.createdAt.toDate ? sub.createdAt.toDate() : new Date(sub.createdAt)) : null,
                        lastDocId: sub.id
                    };
                }
                if (sub.teamMembers && !teamMap[tName].members) teamMap[tName].members = sub.teamMembers;
                if (sub.giftClaimed) {
                    teamMap[tName].giftClaimed = true;
                    teamMap[tName].giftClaimedTime = sub.giftClaimedTime;
                }
                if (sub.status === 'approved') {
                    const lvlStr = String(sub.levelId || '');
                    for (let i = 1; i <= 7; i++) {
                        if (lvlStr.includes(`L${i}`) || lvlStr.includes(`任務${i}`) || lvlStr.includes(`第${i}`)) {
                            teamMap[tName].approvedLevels.add(i);
                        }
                    }
                }
            });

            let teams = Object.values(teamMap);
            if (searchQuery) {
                teams = teams.filter(t => t.name.toLowerCase().includes(searchQuery) || t.members.toLowerCase().includes(searchQuery));
            }

            if (teams.length === 0) {
                container.innerHTML = `
                    <div class="military-card p-10 text-center text-stone-500">
                        <i class="fa-solid fa-users-slash text-4xl mb-3 opacity-40"></i>
                        <p class="text-sm font-bold">目前無任何隊伍進度紀錄</p>
                    </div>`;
                return;
            }

            container.innerHTML = teams.map(t => {
                const count = t.approvedLevels.size;
                const isFinished = count >= 7 || t.approvedLevels.has(7);
                const lastTimeStr = t.lastActive ? t.lastActive.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }) : '--:--';

                return `
                <div class="military-card p-4 space-y-3 border-l-4 ${isFinished ? 'border-l-emerald-500' : 'border-l-amber-500'}">
                    <div class="flex items-start justify-between border-b border-[#332c25] pb-2">
                        <div>
                            <div class="flex items-center space-x-2">
                                <b class="text-[#e5d5b5] text-base font-black">${escapeHtml(t.name)}</b>
                                ${isFinished ? '<span class="text-[10px] bg-emerald-900/60 text-emerald-300 border border-emerald-700 px-1.5 py-0.5 rounded font-mono font-bold">已抵達終點</span>' : ''}
                            </div>
                            ${t.members ? `<div class="text-xs text-stone-400 mt-0.5"><i class="fa-solid fa-id-card text-stone-500 mr-1"></i>隊員：${escapeHtml(t.members)}</div>` : ''}
                        </div>
                        <span class="text-[11px] font-mono text-stone-400">最後回報：${lastTimeStr}</span>
                    </div>

                    <!-- 關卡進度指示條 -->
                    <div>
                        <div class="flex justify-between text-[11px] font-mono text-stone-400 mb-1">
                            <span>解密進度：${count}/7 關</span>
                            <span class="text-amber-400 font-bold">${Math.round((count/7)*100)}%</span>
                        </div>
                        <div class="grid grid-cols-7 gap-1">
                            ${[1,2,3,4,5,6,7].map(lvl => `
                                <div class="py-1 text-center text-[10px] font-mono font-bold rounded ${t.approvedLevels.has(lvl) ? 'bg-emerald-800 text-emerald-200 border border-emerald-600' : 'bg-[#292524] text-stone-600 border border-[#443c33]'}">
                                    L${lvl}
                                </div>
                            `).join('')}
                        </div>
                    </div>

                    <!-- 紀念品核銷按鈕 -->
                    <div class="pt-2 border-t border-[#332c25] flex items-center justify-between">
                        <div class="text-xs font-mono">
                            ${t.giftClaimed ? `
                                <span class="text-emerald-400 font-bold flex items-center">
                                    <i class="fa-solid fa-circle-check mr-1"></i>已領取禮品 (${t.giftClaimedTime || '已核銷'})
                                </span>` : `
                                <span class="text-stone-500">未核銷兌獎</span>`}
                        </div>
                        <button onclick="toggleGiftClaim('${escapeHtml(t.name)}', ${!t.giftClaimed})" class="px-3 py-1.5 rounded text-xs font-black tracking-wider ${t.giftClaimed ? 'bg-[#292524] text-stone-400 hover:text-stone-200 border border-[#443c33]' : 'bg-emerald-700 hover:bg-emerald-600 text-white shadow-sm'}">
                            ${t.giftClaimed ? '取消核銷' : '<i class="fa-solid fa-gift mr-1"></i>登記領獎'}
                        </button>
                    </div>
                </div>`;
            }).join('');
        }

        // 9. 登記/取消紀念品核銷
        async function toggleGiftClaim(teamName, newClaimedState) {
            try {
                const now = new Date();
                const timeTag = `${now.getHours().toString().padStart(2,'0')}:${now.getMinutes().toString().padStart(2,'0')}`;
                
                // 批次更新該隊所有紀錄中的領獎欄位
                const snapshot = await db.collection("submissions").where("teamName", "==", teamName).get();
                const batch = db.batch();
                snapshot.forEach(doc => {
                    batch.update(doc.ref, {
                        giftClaimed: newClaimedState,
                        giftClaimedTime: newClaimedState ? timeTag : null
                    });
                });
                await batch.commit();

                currentSubmissions.forEach(s => {
                    if (s.teamName === teamName) {
                        s.giftClaimed = newClaimedState;
                        s.giftClaimedTime = newClaimedState ? timeTag : null;
                    }
                });
                renderList();
            } catch (err) {
                alert("核銷變更失敗：" + err.message);
            }
        }

        // 10. 退回原因 Modal 操控
        function openRejectModal(docId) {
            pendingRejectDocId = docId;
            document.getElementById('custom-reject-reason').value = '';
            document.getElementById('reject-modal').classList.remove('hidden');
        }

        function closeRejectModal() {
            pendingRejectDocId = null;
            document.getElementById('reject-modal').classList.add('hidden');
        }

        function selectRejectReason(reason) {
            document.getElementById('custom-reject-reason').value = reason;
        }

        async function confirmReject() {
            if (!pendingRejectDocId) return;
            const customVal = document.getElementById('custom-reject-reason').value.trim();
            const reason = customVal || "長官回報：未達通關要求，請重新確認後送出！";
            
            try {
                await db.collection("submissions").doc(pendingRejectDocId).update({
                    status: 'rejected',
                    rejectReason: reason,
                    reviewedAt: firebase.firestore.FieldValue.serverTimestamp()
                });
                const target = currentSubmissions.find(s => s.id === pendingRejectDocId);
                if (target) {
                    target.status = 'rejected';
                    target.rejectReason = reason;
                }
                closeRejectModal();
                renderList();
            } catch (err) {
                alert("退回失敗：" + err.message);
            }
        }

        // 11. 更新審核狀態
        async function updateStatus(docId, newStatus) {
            try {
                await db.collection("submissions").doc(docId).update({
                    status: newStatus,
                    reviewedAt: firebase.firestore.FieldValue.serverTimestamp()
                });
                const target = currentSubmissions.find(s => s.id === docId);
                if (target) target.status = newStatus;
                renderList();
            } catch (err) {
                alert("狀態變更失敗：" + err.message);
            }
        }

        async function deleteSubmission(docId, photoUrl) {
            if (!confirm("確定要刪除這筆審核紀錄嗎？此動作無法復原！")) return;
            try {
                await db.collection("submissions").doc(docId).delete();
                if (photoUrl && typeof photoUrl === 'string' && photoUrl.startsWith("http") && photoUrl.includes("firebasestorage")) {
                    try {
                        const storageRef = firebase.storage().refFromURL(photoUrl);
                        await storageRef.delete();
                    } catch (e) {}
                }
                currentSubmissions = currentSubmissions.filter(s => s.id !== docId);
                renderList();
            } catch (err) {
                alert("刪除失敗：" + err.message);
            }
        }

        async function clearAllSubmissions() {
            const inputPass = prompt("【警告】這將清空所有審核記錄！\n請輸入確認代碼「C」以執行清空：");
            if (inputPass !== "C") {
                if (inputPass !== null) alert("代碼不正確，已取消操作。");
                return;
            }
            try {
                const snapshot = await db.collection("submissions").get();
                if (snapshot.empty) {
                    alert("目前沒有任何紀錄需要清空。");
                    return;
                }
                const batch = db.batch();
                snapshot.forEach(doc => { batch.delete(doc.ref); });
                await batch.commit();

                currentSubmissions = [];
                renderList();
                alert(`已成功清空共 ${snapshot.size} 筆歷史紀錄！`);
            } catch (err) {
                alert("清空失敗：" + err.message);
            }
        }

        // 12. 燈箱與輔助功能
        function openLightbox(src) {
            if (!src) return;
            document.getElementById('lightbox-img').src = src;
            document.getElementById('lightbox-modal').classList.remove('hidden');
        }
        function closeLightbox() {
            document.getElementById('lightbox-modal').classList.add('hidden');
        }

        function toggleAudio() {
            isAudioEnabled = !isAudioEnabled;
            const btn = document.getElementById('btn-audio');
            btn.innerHTML = isAudioEnabled ? '<i class="fa-solid fa-bell text-amber-400"></i>' : '<i class="fa-solid fa-bell-slash text-stone-500"></i>';
        }

        function escapeHtml(str) {
            return String(str).replace(/[&<>"']/g, s => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[s]);
        }

        window.addEventListener('load', startListening);
        document.addEventListener('visibilitychange', () => {
            if (!document.hidden) startListening();
        });
    </script>
</body>
</html>
